<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f9f8ff"><title>StudyBuddy</title><link rel="manifest" href="/static/manifest.json"><link rel="stylesheet" href="/static/style.css"></head><body>
<svg class="defs"><symbol id="cap" viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5zM6 11v5c3 3 9 3 12 0v-5"/></symbol><symbol id="grid" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol><symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7 12 3 3 7-8"/></symbol><symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></symbol><symbol id="group" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><circle cx="5" cy="10" r="2"/><circle cx="19" cy="10" r="2"/><path d="M6 20c0-4 2-6 6-6s6 2 6 6M1 19c0-3 2-4 4-4m18 4c0-3-2-4-4-4"/></symbol><symbol id="chart" viewBox="0 0 24 24"><path d="m3 18 5-6 4 3 7-8m-4 0h4v4"/></symbol></svg>
<section id="login" class="login active"><div class="login-card"><div class="logo"><svg><use href="#cap"/></svg></div><h1>StudyBuddy</h1><p>Organise. Collaborate. Succeed.</p><form id="login-form"><label class="field"><span>Email</span><b>✉</b><input type="email" value="student@studybuddy.app" required></label><label class="field"><span>Password</span><b>♙</b><input id="password" type="password" value="password" required><button id="eye" type="button">◉</button></label><button class="primary">Sign in</button></form><button class="link" id="create-account">Create an account</button></div></section>
<main id="shell" class="shell hidden"><header><h1 id="title">Dashboard</h1><div>Fahim <b>F</b></div></header>
<section id="dashboard" class="page active"><h2>Hello, Fahim</h2><p>Here is your study plan at a glance.</p><div id="stats" class="stats"></div><h2 class="section-title">Quick actions</h2><div class="quick"><button data-go="tasks">✓ Manage tasks</button><button data-go="calendar">▣ Deadlines</button><button data-go="groups">♣ Study groups</button></div></section>
<section id="tasks" class="page"><div class="segments"><button class="selected" data-filter="all">✓ All</button><button data-filter="pending">Pending</button><button data-filter="completed">Completed</button></div><div id="task-list" class="task-card"></div><button id="new-task" class="fab">＋ <small>New task</small></button></section>
<section id="calendar" class="page"><div class="calendar-hero"><svg><use href="#cal"/></svg><div><b>Deadline calendar</b><span>Assignments arranged by due date.</span></div></div><div id="calendar-list"></div></section>
<section id="groups" class="page"><div id="group-list"></div><button id="new-group" class="fab">♣ <small>New group</small></button></section>
<section id="progress" class="page"><div class="progress-hero"><strong id="percent"></strong><div class="bar"><i></i></div><span id="progress-copy"></span></div><h2 class="section-title">Course progress</h2><div class="course"><div><b>ICT725</b><span id="course-count"></span></div><div class="bar"><i></i></div></div></section>
<nav><button class="selected" data-page="dashboard"><span><svg><use href="#grid"/></svg></span>Dashboard</button><button data-page="tasks"><span><svg><use href="#check"/></svg></span>Tasks</button><button data-page="calendar"><span><svg><use href="#cal"/></svg></span>Calendar</button><button data-page="groups"><span><svg><use href="#group"/></svg></span>Study<br>Groups</button><button data-page="progress"><span><svg><use href="#chart"/></svg></span>Progress</button></nav></main>
<dialog id="task-dialog"><form id="task-form"><h2>Add a task</h2><label>Task name<input name="title" required></label><label>Course<input name="course" value="ICT725" required></label><label>Priority<select name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label><label>Due date<input name="date" value="30 Sep 2026" required></label><div><button type="button" data-close>Cancel</button><button class="primary">Add task</button></div></form></dialog><dialog id="group-dialog"><form id="group-form"><h2>Create a group</h2><label>Group name<input name="name" required></label><label>Course<input name="course" value="ICT725" required></label><div><button type="button" data-close>Cancel</button><button class="primary">Create</button></div></form></dialog><div id="toast"></div><script src="/static/app.js"></script></body></html>
